<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>09 Admin delete confirm - light EN</title>
<style>*{box-sizing:border-box}body{margin:0;background:#D6D5D0}a{color:#101314}a:hover{color:#5C7A0A}</style>
</helmet>
<div style="min-height:100vh;padding:20px 24px 32px;display:flex;flex-direction:column;align-items:center;gap:12px;background:#D6D5D0;overflow-x:auto">
  <p style="margin:0;align-self:stretch;font:500 11px/1.4 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#3A3F41">Admin · delete confirmation · light · EN · 1440</p>
  <div data-zoom="1">
    <div data-ref-frame="1" style="position:relative;width:1440px;height:900px;transform:translateZ(0);overflow:hidden;border-radius:6px;box-shadow:0 20px 50px -24px rgba(16,19,20,.5)">
      <dc-import name="Demos Admin" theme="light" lang="en" view="delete" mobile="{{ false }}" style="width:1440px;height:900px" hint-size="1440px,900px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  fit = () => { const el = document.querySelector('[data-zoom]'); if (el) el.style.zoom = String(Math.min(1, (innerWidth - 48) / 1440)); };
  componentDidMount() { this.fit(); setTimeout(this.fit, 50); addEventListener('resize', this.fit); }
  componentDidUpdate() { this.fit(); }
  componentWillUnmount() { removeEventListener('resize', this.fit); }
  renderVals() { return {}; }
}
</script>
</body>
</html>
