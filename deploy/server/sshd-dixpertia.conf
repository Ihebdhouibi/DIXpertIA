# SSH server settings for the DIXpertIA VPS (#172).
# Installed as /etc/ssh/sshd_config.d/01-dixpertia.conf by 03-ssh-lockdown.sh,
# which replaces __ADMIN_USER__. "01-" so it is read before Ubuntu's
# 50-cloud-init.conf: sshd keeps the first value it reads for each setting.

# Keys only: no passwords, no keyboard-interactive, no root.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods publickey

# Only the admin user may sign in at all.
AllowUsers __ADMIN_USER__

# Fewer guesses per connection, less time to make them.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# Nothing the server needs.
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
# Kept on: the Dokploy dashboard is reached through an SSH tunnel (#183).
AllowTcpForwarding local

# Drop dead sessions.
ClientAliveInterval 300
ClientAliveCountMax 2
