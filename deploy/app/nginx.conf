# The frontend's static server (#185), in the dixpertia-web image.
# Behind Traefik, which terminates HTTPS and sets HSTS (#184); this server
# only ever sees plain HTTP from inside the Docker network.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # Vite fingerprints these files (name-hash.js): cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy would leave browsers on the
    # previous build's file names. The app has no router: every path that is
    # not a file gets index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Nothing here is meant to be fetched by path.
    location ~ /\. {
        deny all;
    }
}
