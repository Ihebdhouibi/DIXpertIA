# Security headers for every response of the frontend (#185). Included in each
# location: an add_header inside a location silently drops the server's own.
#
# Content-Security-Policy, what each source is for:
# - script-src 'self': only the built bundle. There is no inline script.
# - style-src 'unsafe-inline': React and motion set style attributes. Google
#   Fonts' stylesheet until the fonts are self-hosted.
# - font-src fonts.gstatic.com: Google Fonts (see the PR: self-hosting them
#   would stop sending every visitor's address to Google, a GDPR concern).
# - img-src data: blob:: inline icons, and previews made in the browser.
# - worker-src 'self' blob:: the PDF preview's pdf.js worker.
# - connect-src 'self': the API is on the same origin, under /api.
# - frame-ancestors 'none': no other site may frame these pages (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
