# Security headers for every response of the frontend (#185). Included in each
# location: an add_header inside a location silently drops the server's own.
#
# Content-Security-Policy, what each source is for:
# - script-src 'self': only the built bundle. There is no inline script.
# - style-src 'unsafe-inline': React and motion set style attributes. Google
#   Fonts' stylesheet until the fonts are self-hosted.
# - font-src fonts.gstatic.com: Google Fonts (see the PR: self-hosting them
#   would stop sending every visitor's address to Google, a GDPR concern).
# - img-src data: blob:: inline icons, and previews made in the browser.
# - worker-src 'self' blob:: the PDF preview's pdf.js worker.
# - connect-src 'self': the API is on the same origin, under /api.
# - frame-ancestors 'none': no other site may frame these pages (clickjacking).
# - frame-src: the demo videos' players (#232), loaded only when a visitor
#   clicks Play - Google Drive, YouTube's no-cookie host and Vimeo, the three
#   providers app/services/demo_links.py recognises, and nothing else.
# - img-src: their preview images - Drive's thumbnails (served from
#   googleusercontent.com after a redirect) and YouTube's (i.ytimg.com).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com https://i.ytimg.com; frame-src https://drive.google.com https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS (#184): once a browser has seen this over HTTPS, it refuses plain HTTP
# for this host for a year, so a network attacker cannot downgrade the
# connection. Browsers ignore it over HTTP. No includeSubDomains: other names
# under dixpertia.tn (mail, ftp) are not ours to force onto HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
