# The staging cluster's own settings (#184), on top of dixpertia.conf.
#
# Installed as /etc/postgresql/17/staging/conf.d/zz-staging.conf by
# `CLUSTER=staging apply.sh`: "zz-" so it is read after dixpertia.conf, and a
# later setting wins. Everything else - timeouts, logging, listen addresses,
# pg_hba - is production's, so staging tests the same rules.
#
# A separate cluster, not a second database: roles belong to the whole
# cluster, and the migrations name dixpertia_app and dixpertia_owner. In one
# cluster, staging would share production's roles and their passwords.

port = 5433

# A small share of the 7.8 GB: production keeps its 1 GB of shared buffers.
max_connections = 20
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB
