# Who may connect, from where, to what (#158). Installed as
# /etc/postgresql/17/main/pg_hba.conf by apply.sh, replacing the packaged one
# (kept beside it as pg_hba.conf.orig).
#
# The first matching line decides; a connection matching no line is refused.
# So: the postgres superuser only from a shell on the server itself, by its
# OS identity; the two application roles (db/sql/001-roles-and-grants.sql) only
# to the dixpertia database, only from this machine, only with a password.
# Nothing else - no other role, no other database, no remote address, no
# replication.

# TYPE  DATABASE   USER                            ADDRESS        METHOD
local   all        postgres                                       peer
local   dixpertia  dixpertia_app,dixpertia_owner                  scram-sha-256
host    dixpertia  dixpertia_app,dixpertia_owner   127.0.0.1/32   scram-sha-256
host    dixpertia  dixpertia_app,dixpertia_owner   ::1/128        scram-sha-256
# The API's container, through docker_gwbridge (#183). The same two roles, the
# same database, a password: never postgres, never another database.
host    dixpertia  dixpertia_app,dixpertia_owner   172.18.0.0/16  scram-sha-256
