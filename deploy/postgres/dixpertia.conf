# PostgreSQL 17 server settings for DI Xpertia (#158, AUDIT-DB-021).
#
# Installed as /etc/postgresql/17/main/conf.d/dixpertia.conf by apply.sh.
# Ubuntu's postgresql.conf includes conf.d/, and a later setting wins, so
# everything we decide lives here and the packaged file stays untouched.

# --- Connections ----------------------------------------------------------------
# This machine only: the API runs on the same VPS, so the database is never
# reachable from the network and its connection never leaves the host (which
# is why no TLS is configured for it). The firewall of #172 is a second
# barrier, not the first.
#
# 172.18.0.1 is the host's side of docker_gwbridge, the bridge through which
# the API's container (Dokploy, #183) reaches this host. It is not a public
# address: pg_hba.conf admits only the application roles from that bridge,
# and ufw allows 5432 on that interface only. Until Docker runs, PostgreSQL
# cannot bind it, logs a warning and serves localhost; the boot-order rule
# apply.sh installs starts it after Docker.
listen_addresses = 'localhost,172.18.0.1'
port = 5432
# The API's pool plus migrations and maintenance; far below what 7.8 GB allows.
max_connections = 50

# --- Memory, for 7.8 GB shared with the API --------------------------------------
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB

# --- Authentication --------------------------------------------------------------
password_encryption = scram-sha-256

# --- Timeouts --------------------------------------------------------------------
# A safety net for every role. The application role has tighter ones, set on
# the role by db/sql/001-roles-and-grants.sql (30s, 60s - #70). These are loose
# enough for a migration; a longer one sets its own with SET. pg_dump turns
# statement_timeout off for itself.
statement_timeout = '5min'
idle_in_transaction_session_timeout = '10min'

# --- Logging ---------------------------------------------------------------------
# Who connected, and every schema change: the audit trail of #63 records what
# users did in the application, these record what reached the database.
log_connections = on
log_disconnections = on
log_statement = 'ddl'
# Slow queries, against the indexes of #61.
log_min_duration_statement = '500ms'
log_lock_waits = on
log_temp_files = '10MB'
# Time, process, then user@database on every line.
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Africa/Tunis'
# Server messages in English: searchable, and the same text the application
# recognises and translates (#135, #161).
lc_messages = 'C'
